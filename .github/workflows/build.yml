name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;30.0.16248370" "cmake;3.30.4"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: android/deps/out
          key: deps-${{ hashFiles('android/deps/build_deps.sh') }}

      - name: Build dependencies
        run: |
          cd android/deps
          bash build_deps.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/totkrecompandroid/**/*.gradle.kts', 'android/totkrecompandroid/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APK
        run: |
          cd android/totkrecompandroid
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOTKDroid-release
          path: android/totkrecompandroid/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
