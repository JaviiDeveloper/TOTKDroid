name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/30.0.16248370

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install CMake 3.30.4
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.4"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: android/deps/out
          key: deps-${{ hashFiles('android/deps/build_deps.sh') }}

      - name: Build dependencies
        run: |
          cd android/deps
          bash build_deps.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/totkrecompandroid/**/*.gradle.kts', 'android/totkrecompandroid/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APK
        run: |
          cd android/totkrecompandroid
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --info 2>&1 | tail -200

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOTKDroid-release
          path: android/totkrecompandroid/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
